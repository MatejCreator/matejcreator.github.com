<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/samurai.png" type="image/png">
    <title>Matej Palčo</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            cursor: none;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    function goFullscreen() {
        const el = document.documentElement;
        if (document.fullscreenElement) return;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
    }

    document.addEventListener("DOMContentLoaded", () => {
        goFullscreen();
    });
    canvas.addEventListener("click", goFullscreen);
    document.addEventListener("fullscreenchange", resize);
    window.addEventListener("resize", resize);

    // Classic Matrix: katakana + latin + digits, film green
    const letters =
        "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const lettersArray = letters.split("");

    const fontSize = 18;
    let columns = 0;
    let drops = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        const old = drops.slice();
        drops = Array.from({ length: columns }, (_, i) =>
            old[i] != null ? old[i] : Math.random() * -50
        );
    }

    resize();

    function draw() {
        // Stronger wipe = kratší shadow (nesmie sa zlievať do zelenej plochy)
        ctx.fillStyle = "rgba(0, 0, 0, 0.14)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = fontSize + "px monospace";

        for (let i = 0; i < drops.length; i++) {
            const text = lettersArray[Math.floor(Math.random() * lettersArray.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;

            ctx.fillStyle = "#c8ffc8";
            ctx.fillText(text, x, y);

            // Len jedna krátka stopa, nie dlhý zelený chvost
            if (drops[i] > 1) {
                ctx.fillStyle = "#00ff41";
                ctx.globalAlpha = 0.55;
                ctx.fillText(
                    lettersArray[Math.floor(Math.random() * lettersArray.length)],
                    x,
                    y - fontSize
                );
                ctx.globalAlpha = 1;
            }

            if (y > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }

        setTimeout(() => requestAnimationFrame(draw), 70);
    }

    draw();
</script>
</body>
</html>
