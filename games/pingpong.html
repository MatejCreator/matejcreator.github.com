<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/samurai.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <title>Ping Pong · Matej Palčo</title>
    <style>
        :root {
            --bg: #1a222c;
            --panel: #222b38;
            --line: rgba(140, 200, 255, 0.25);
            --text: #eef3f8;
            --muted: #a8b6c6;
            --blue: #8ec8ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(50, 110, 160, 0.25), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: "Source Sans 3", sans-serif;
        }
        .top {
            width: min(720px, 94vw);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .back {
            color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            width: 2.2rem;
            height: 2.2rem;
            display: grid;
            place-items: center;
        }
        .back:hover { color: var(--blue); border-color: var(--blue); }
        .score {
            font-family: "IBM Plex Mono", monospace;
            font-size: 1.35rem;
            letter-spacing: 0.08em;
        }
        .score span { color: var(--blue); }
        canvas {
            display: block;
            width: min(720px, 94vw);
            height: auto;
            background: #121820;
            border: 1px solid var(--line);
            border-radius: 10px;
            touch-action: none;
        }
        .hint {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="top">
        <a class="back" href="../play.html" title="Späť">←</a>
        <div class="score" id="score">Ty <span>0</span> : <span>0</span> AI</div>
        <span style="width:2.2rem"></span>
    </div>
    <canvas id="game" width="720" height="420"></canvas>
    <p class="hint">Myš / prst = pálka · medzerník = pauza / reštart po góle</p>

    <script>
        (function () {
            const canvas = document.getElementById("game");
            const ctx = canvas.getContext("2d");
            const scoreEl = document.getElementById("score");

            const W = canvas.width;
            const H = canvas.height;
            const PADDLE_W = 12;
            const PADDLE_H = 78;
            const BALL = 9;

            let playerY = H / 2 - PADDLE_H / 2;
            let aiY = H / 2 - PADDLE_H / 2;
            let ballX = W / 2;
            let ballY = H / 2;
            let ballVX = 5;
            let ballVY = 3;
            let playerScore = 0;
            let aiScore = 0;
            let paused = false;
            let waiting = true;

            function resetBall(dir) {
                ballX = W / 2;
                ballY = H / 2;
                const speed = 5 + Math.min(playerScore + aiScore, 8) * 0.25;
                ballVX = speed * (dir || (Math.random() > 0.5 ? 1 : -1));
                ballVY = (Math.random() * 2 - 1) * 3.5;
                waiting = true;
                paused = false;
            }

            function updateScore() {
                scoreEl.innerHTML = "Ty <span>" + playerScore + "</span> : <span>" + aiScore + "</span> AI";
            }

            function setPlayerFromClientY(clientY) {
                const rect = canvas.getBoundingClientRect();
                const scale = H / rect.height;
                playerY = (clientY - rect.top) * scale - PADDLE_H / 2;
                playerY = Math.max(0, Math.min(H - PADDLE_H, playerY));
            }

            canvas.addEventListener("mousemove", function (e) {
                setPlayerFromClientY(e.clientY);
            });
            canvas.addEventListener("touchmove", function (e) {
                e.preventDefault();
                if (e.touches[0]) setPlayerFromClientY(e.touches[0].clientY);
            }, { passive: false });

            window.addEventListener("keydown", function (e) {
                if (e.code === "Space") {
                    e.preventDefault();
                    if (waiting) {
                        waiting = false;
                    } else {
                        paused = !paused;
                    }
                }
            });

            canvas.addEventListener("click", function () {
                if (waiting) waiting = false;
            });

            function collide(px, py) {
                return (
                    ballX + BALL > px &&
                    ballX - BALL < px + PADDLE_W &&
                    ballY + BALL > py &&
                    ballY - BALL < py + PADDLE_H
                );
            }

            function step() {
                if (!paused && !waiting) {
                    ballX += ballVX;
                    ballY += ballVY;

                    if (ballY - BALL < 0) {
                        ballY = BALL;
                        ballVY *= -1;
                    } else if (ballY + BALL > H) {
                        ballY = H - BALL;
                        ballVY *= -1;
                    }

                    if (collide(18, playerY) && ballVX < 0) {
                        ballX = 18 + PADDLE_W + BALL;
                        ballVX = Math.abs(ballVX) * 1.03;
                        const hit = (ballY - (playerY + PADDLE_H / 2)) / (PADDLE_H / 2);
                        ballVY = hit * 5.5;
                    }

                    if (collide(W - 18 - PADDLE_W, aiY) && ballVX > 0) {
                        ballX = W - 18 - PADDLE_W - BALL;
                        ballVX = -Math.abs(ballVX) * 1.03;
                        const hit = (ballY - (aiY + PADDLE_H / 2)) / (PADDLE_H / 2);
                        ballVY = hit * 5.5;
                    }

                    // AI — jednoduché sledovanie
                    const aiCenter = aiY + PADDLE_H / 2;
                    const target = ballY;
                    const aiSpeed = 3.4 + Math.min(playerScore, 6) * 0.15;
                    if (aiCenter < target - 8) aiY += aiSpeed;
                    else if (aiCenter > target + 8) aiY -= aiSpeed;
                    aiY = Math.max(0, Math.min(H - PADDLE_H, aiY));

                    if (ballX < -20) {
                        aiScore++;
                        updateScore();
                        resetBall(1);
                    } else if (ballX > W + 20) {
                        playerScore++;
                        updateScore();
                        resetBall(-1);
                    }
                }

                draw();
                requestAnimationFrame(step);
            }

            function draw() {
                ctx.fillStyle = "#121820";
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = "rgba(140, 200, 255, 0.2)";
                ctx.setLineDash([8, 10]);
                ctx.beginPath();
                ctx.moveTo(W / 2, 0);
                ctx.lineTo(W / 2, H);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = "#8ec8ff";
                ctx.fillRect(18, playerY, PADDLE_W, PADDLE_H);
                ctx.fillStyle = "#3d9b72";
                ctx.fillRect(W - 18 - PADDLE_W, aiY, PADDLE_W, PADDLE_H);

                ctx.beginPath();
                ctx.arc(ballX, ballY, BALL, 0, Math.PI * 2);
                ctx.fillStyle = "#eef3f8";
                ctx.fill();

                if (waiting || paused) {
                    ctx.fillStyle = "rgba(18, 24, 32, 0.55)";
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = "#eef3f8";
                    ctx.font = "600 22px 'Source Sans 3', sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(
                        waiting ? "Klik / medzerník — štart" : "Pauza",
                        W / 2,
                        H / 2
                    );
                }
            }

            updateScore();
            resetBall(1);
            step();
        })();
    </script>
</body>
</html>
