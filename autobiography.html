<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autobiografia · Matej Palčo</title>
    <link rel="icon" href="images/samurai.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/style_autobiography.css">
</head>
<body class="theme-base">
    <header class="top-bar">
        <a href="index.html" class="home-btn" title="Domov">←</a>
        <div class="auth-container">
            <div class="auth-row">
                <span id="access-status" data-auth-label>Hosť</span>
                <input type="password" id="access-code" placeholder="Zadaj kľúč…" autocomplete="off">
                <button type="button" class="btn-unlock" id="btn-unlock" title="Odomknúť">→</button>
                <button type="button" class="btn-logout" id="btn-logout" title="Odhlásiť">Odhlásiť</button>
            </div>
            <div id="auth-msg" class="auth-msg" role="status"></div>
        </div>
    </header>

    <div class="timeline-nav" id="nav-container"></div>

    <div class="page-scroll">
        <div class="content-container">
            <h1 class="year-title" id="display-year">Načítavam…</h1>
            <div class="public-text" id="public-content">Načítavam autobiografiu…</div>
            <div class="private-text" id="private-content"></div>
            <div class="secret-text" id="secret-content"></div>
            <p class="locked-hint" id="locked-hint" hidden>
                Niektoré zápisy sú zamknuté. Prihlás sa kľúčom hore — podľa úrovne uvidíš viac.
            </p>

            <div class="love-gate" id="love-gate" data-min-level="2" hidden>
                <div>
                    <h3>Pre teba</h3>
                    <p>Len ty toto uvidíš.</p>
                </div>
                <a href="mystery_love.html" title="Otvoriť">♥</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let bioData = {};
        let currentYear = 2026;
        const navContainer = document.getElementById("nav-container");
        const statusEl = document.getElementById("access-status");
        const msgEl = document.getElementById("auth-msg");
        const logoutBtn = document.getElementById("btn-logout");

        function refreshAuthUI() {
            const session = Auth.getSession();
            statusEl.textContent = session.label;
            statusEl.classList.toggle("is-auth", session.level > 0);
            logoutBtn.classList.toggle("is-visible", session.level > 0);
            Auth.applyVisibility();
            updateContent();
        }

        let msgTimer = null;
        function showAuthMsg(text, kind) {
            msgEl.textContent = text || "";
            msgEl.className = "auth-msg" + (kind ? " " + kind : "");
            clearTimeout(msgTimer);
            if (text) {
                msgTimer = setTimeout(function () {
                    msgEl.textContent = "";
                    msgEl.className = "auth-msg";
                }, 2800);
            }
        }

        async function tryLogin() {
            const input = document.getElementById("access-code");
            const result = await Auth.login(input.value);
            showAuthMsg(result.message, result.ok ? "ok" : "error");
            input.value = "";
            refreshAuthUI();
        }

        document.getElementById("btn-unlock").addEventListener("click", tryLogin);
        document.getElementById("access-code").addEventListener("keydown", (e) => {
            if (e.key === "Enter") tryLogin();
        });
        logoutBtn.addEventListener("click", () => {
            Auth.logout();
            showAuthMsg("Odhlásené.", "");
            refreshAuthUI();
        });

        fetch("data/TextData.json")
            .then((r) => {
                if (!r.ok) throw new Error("Súbor sa nenašiel");
                return r.json();
            })
            .then((data) => {
                bioData = data;
                initializeTimeline();
                refreshAuthUI();
            })
            .catch(() => {
                document.getElementById("display-year").textContent = "—";
                document.getElementById("public-content").textContent =
                    "Nepodarilo sa načítať TextData.json. Otvor stránku cez lokálny server (nie file://).";
            });

        function initializeTimeline() {
            for (let year = 2004; year <= 2026; year++) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "year-btn";
                btn.textContent = year;
                btn.addEventListener("click", () => selectYear(year, btn));
                navContainer.appendChild(btn);
                if (year === currentYear) btn.classList.add("active");
            }
        }

        let scrollTarget = 0;
        let scrollCurrent = 0;
        let scrolling = false;

        function tickScroll() {
            scrolling = true;
            scrollCurrent += (scrollTarget - scrollCurrent) * 0.12;
            if (Math.abs(scrollTarget - scrollCurrent) < 0.35) {
                scrollCurrent = scrollTarget;
                navContainer.scrollLeft = scrollCurrent;
                scrolling = false;
                return;
            }
            navContainer.scrollLeft = scrollCurrent;
            requestAnimationFrame(tickScroll);
        }

        navContainer.addEventListener("mousemove", (e) => {
            const rect = navContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const percentage = x / rect.width;
            const edge = 0.18;
            let t = (percentage - edge) / (1 - 2 * edge);
            t = Math.max(0, Math.min(1, t));
            const maxScroll = navContainer.scrollWidth - navContainer.clientWidth;
            if (maxScroll <= 0) return;
            scrollTarget = t * maxScroll;
            if (!scrolling) tickScroll();
        });

        navContainer.addEventListener("wheel", (e) => {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                e.preventDefault();
                const maxScroll = navContainer.scrollWidth - navContainer.clientWidth;
                scrollTarget = Math.max(0, Math.min(maxScroll, scrollTarget + e.deltaY));
                if (!scrolling) {
                    scrollCurrent = navContainer.scrollLeft;
                    tickScroll();
                }
            }
        }, { passive: false });

        function selectYear(year, clickedBtn) {
            currentYear = year;
            document.querySelectorAll(".year-btn").forEach((b) => b.classList.remove("active"));
            clickedBtn.classList.add("active");
            updateContent();
        }

        function updateContent() {
            document.getElementById("display-year").textContent = currentYear;
            const data = bioData[currentYear] || {
                public: "Detaily za tento rok sa ešte píšu.",
                private: "",
                secret: ""
            };

            document.getElementById("public-content").textContent = data.public || "";

            const level = Auth.getLevel();
            const privateDiv = document.getElementById("private-content");
            const secretDiv = document.getElementById("secret-content");
            const hint = document.getElementById("locked-hint");

            if (level >= Auth.LEVEL.FRIEND && data.private) {
                privateDiv.replaceChildren();
                const label = document.createElement("strong");
                label.textContent = "Súkromný zápis";
                privateDiv.appendChild(label);
                privateDiv.appendChild(document.createElement("br"));
                privateDiv.appendChild(document.createTextNode(data.private));
                privateDiv.classList.add("visible");
            } else {
                privateDiv.classList.remove("visible");
                privateDiv.replaceChildren();
            }

            if (level >= Auth.LEVEL.LOVE && data.secret) {
                secretDiv.replaceChildren();
                const label = document.createElement("strong");
                label.textContent = "Len pre teba";
                secretDiv.appendChild(label);
                secretDiv.appendChild(document.createElement("br"));
                secretDiv.appendChild(document.createTextNode(data.secret));
                secretDiv.classList.add("visible");
            } else {
                secretDiv.classList.remove("visible");
                secretDiv.replaceChildren();
            }

            const hasLocked =
                (data.private && level < Auth.LEVEL.FRIEND) ||
                (data.secret && level < Auth.LEVEL.LOVE);
            hint.hidden = !hasLocked;

            Auth.applyVisibility();
        }

        refreshAuthUI();
    </script>
</body>
</html>
